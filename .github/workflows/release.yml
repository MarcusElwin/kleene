name: Release

# Builds the `kleene` binary for macOS (Apple silicon and Intel) and Linux
# (x86_64 and aarch64), attaches the tarballs and SHA-256 checksums to the
# GitHub release for a tag, and commits the new version and checksums to
# Formula/kleene.rb on main, so the tap serves the release at once.
#
# Versions come from release-please (release-please.yml next to this file):
# it keeps a release pull request open on main from the conventional
# commits merged since the last tag, and merging that PR bumps Cargo.toml,
# Cargo.lock and CHANGELOG.md, then creates the tag `v<version>` and the
# release with the changelog as its notes. That tag push is what runs this
# workflow; it builds and uploads the assets to the release that already
# exists. A tag whose release already carries SHA256SUMS is a no-op, so
# re-delivered tag events do not rebuild.
#
# "Run workflow" with a tag rebuilds that release's assets by hand; with the
# tag left empty it releases the version main is at, if it has no tag yet
# (the pre-release-please route, kept for emergencies).
#
# The release is created or updated with the `RELEASE_TOKEN` secret when it
# is set: a fine-grained personal access token for this repository with
# Contents: read and write. GitHub refuses release creation from the
# workflow's own GITHUB_TOKEN here (403 "Resource not accessible by
# integration" on the first run, 6 October 2026), so the secret is what
# makes the publish job work; without it the job falls back to GITHUB_TOKEN.
#
# DuckDB is compiled from source inside the build, so each target takes ten
# to fifteen minutes; the cargo cache keeps re-runs on the same toolchain fast.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v0.1.0); empty releases the version in Cargo.toml on main"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  BIN: kleene

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Pick the tag
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish=true
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            # release-please creates the tag and the release before this
            # run starts; the assets are what is missing. A release that
            # already has them (a re-delivered tag event, a manual tag push
            # for a finished release) is left alone.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              echo "::notice::$tag already has its assets; nothing to do"
              publish=false
            fi
          else
            # A push to main, or a dispatch with the tag left empty.
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "kleene") | .version')"
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag already exists; nothing to release"
              publish=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag publish=$publish"

  build:
    name: ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p kleene --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          ./target/${{ matrix.target }}/release/$BIN --version
          ./target/${{ matrix.target }}/release/$BIN repl -c "SELECT 1 + 1 AS two"
      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="$BIN-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$NAME/"
          cp README.md LICENSE* "dist/$NAME/" 2>/dev/null || true
          cp -r docs/DIALECT.md "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          echo "asset=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$NAME.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  release:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "## SHA-256" >> notes.md
          echo '```' >> notes.md
          cat SHA256SUMS >> notes.md
          echo '```' >> notes.md
          echo >> notes.md
          echo "Install with \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\` or \`brew install ${{ github.repository_owner }}/kleene/kleene\`." >> notes.md
      - name: Checksum values
        run: cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Uploads to the release release-please made for the tag and
          # appends the checksums to its changelog notes. A tag pushed by
          # hand has no release yet: one is created on that commit with the
          # checksums as its notes.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          append_body: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Point the Homebrew formula at this release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd repo
          scripts/update-formula.sh "${TAG#v}" ../dist/SHA256SUMS
          if git diff --quiet; then
            echo "::notice::Formula/kleene.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(formula): kleene ${TAG#v} checksums"
          git push origin HEAD:main
