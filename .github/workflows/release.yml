name: Release

# Publishes the `kleene` binary for macOS (Apple silicon and Intel) and Linux
# (x86_64 and aarch64) as tarballs with SHA-256 checksums on a GitHub release,
# and prints the values the Homebrew formula needs.
#
# It runs in three situations:
#   * a merge to main that changes the workspace version in Cargo.toml: when
#     no tag `v<version>` exists yet, the release job creates it on the merge
#     commit and publishes. Bumping the version in a PR is the release button.
#   * a pushed tag `v*`, for releasing a commit by hand.
#   * "Run workflow" with an existing tag, to rebuild a release.
# A merge that does not change the version runs only the short `version`
# job and stops.
#
# DuckDB is compiled from source inside the build, so each target takes ten
# to fifteen minutes; the cargo cache keeps re-runs on the same toolchain fast.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN: kleene

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Pick the tag
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          publish=true
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "kleene") | .version')"
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag already exists; nothing to release"
              publish=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag publish=$publish"

  build:
    name: ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p kleene --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          ./target/${{ matrix.target }}/release/$BIN --version
          ./target/${{ matrix.target }}/release/$BIN repl -c "SELECT 1 + 1 AS two"
      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NAME="$BIN-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$NAME/"
          cp README.md LICENSE* "dist/$NAME/" 2>/dev/null || true
          cp -r docs/DIALECT.md "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          echo "asset=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$NAME.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  release:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "## SHA-256" >> notes.md
          echo '```' >> notes.md
          cat SHA256SUMS >> notes.md
          echo '```' >> notes.md
          echo >> notes.md
          echo "Install with \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\` or \`brew install ${{ github.repository_owner }}/kleene/kleene\`." >> notes.md
      - name: Formula values
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "Homebrew formula (Formula/kleene.rb in the tap): set version to ${TAG#v} and these sha256 values:"
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it does not exist yet (a
          # version bump merged to main); reuses it otherwise.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: dist/notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
