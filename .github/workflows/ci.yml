name: CI

on:
  # Branch pushes are covered by the pull_request trigger while a PR is open;
  # listing claude/** here ran every commit twice, and both jobs then raced to
  # save the same rust-cache key.
  push:
    branches: ["main"]
    paths-ignore:
      # Nothing under these is read by a build or a test; a docs-only push
      # skips the DuckDB build entirely. If a check here ever becomes
      # required by branch protection, a skipped run counts as missing, so
      # drop this filter at the same time.
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "Formula/**"
      - "install.sh"
      - "site/**"
      - "wiki/**"
      - "paper/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "Formula/**"
      - "install.sh"
      - "site/**"
      - "wiki/**"
      - "paper/**"

# On a PR a new push supersedes the run it replaces; at ~30 min a job that
# matters. On main the runs queue instead: two merges 35 s apart once left
# the newer head with its test job cancelled, and re-running the older run
# from the Actions page cancelled the newer one's test a second time (the
# re-run joins the same group), so main's head had no test result at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Test binaries that link DuckDB are ~700 MB each with debug info; the
  # runner has ~14 GB. Line tables are enough for a backtrace in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Two caches, two jobs:
  #
  # rust-cache saves target/ under a key derived from Cargo.lock and the
  # manifests. A dependency bump misses it, and the fallback to an older key
  # only helps until the old entries are evicted (10 GB per repository).
  #
  # sccache is content-addressed per compilation unit and is what makes the
  # DuckDB build survive that: the `cc` crate sees RUSTC_WRAPPER=sccache and
  # routes the amalgamation's C++ through it too, so every object of the
  # bundled DuckDB is a cache hit whenever the source, flags and compiler are
  # the same, whichever key rust-cache missed on and whichever job asks.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (actions/runner-images
  # #14748); pinned so the image, and with it sccache's hit rate on the
  # DuckDB objects, only changes when we say so.
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy, doc
    runs-on: ubuntu-24.04
    # Cold, clippy alone is ~15 min (bundled DuckDB under the check profile).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # DuckDB builds at ~4 GB per profile variant and every test binary
      # that links the store carries it. Without this, lld dies with SIGBUS
      # part-way through linking the kleene-difftest test binary.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # Default is false: a red run discards the entire DuckDB build and
          # the next run starts cold again.
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # Not `always()`: a job cancelled before sccache was installed (the
      # concurrency group cancelling it during "Free disk space") then ran
      # this step and failed it with "sccache: command not found".
      - name: Cache stats
        if: ${{ !cancelled() }}
        run: |
          command -v sccache >/dev/null && sccache --show-stats
          df -h /

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true

      - name: Test
        run: cargo test --workspace --all-features
      # Not `always()`: a job cancelled before sccache was installed (the
      # concurrency group cancelling it during "Free disk space") then ran
      # this step and failed it with "sccache: command not found".
      - name: Cache stats
        if: ${{ !cancelled() }}
        run: |
          command -v sccache >/dev/null && sccache --show-stats
          df -h /