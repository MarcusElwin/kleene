name: CI

on:
  # Branch pushes are covered by the pull_request trigger while a PR is open;
  # listing claude/** here ran every commit twice, and both jobs then raced to
  # save the same rust-cache key.
  push:
    branches: ["main"]
  pull_request:

# A new push supersedes the run it replaces. At ~30 min a job that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Test binaries that link DuckDB are ~700 MB each with debug info; the
  # runner has ~14 GB. Line tables are enough for a backtrace in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # Cold, clippy alone is ~15 min (bundled DuckDB under the check profile)
    # and the test profile builds a second variant.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # DuckDB builds three profile variants at ~4 GB each and every test
      # binary that links the store carries it. Without this, lld dies with
      # SIGBUS part-way through linking callgebra-difftest.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Default is false: a red run discards the entire DuckDB build and
          # the next run starts cold again.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Disk after clippy
        if: always()
        run: df -h /
      - name: Test
        run: cargo test --workspace --all-features
      - name: Disk after test
        if: always()
        run: df -h /
      - name: Doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
