[package]
name = "kleene"
description = "Kleene: relational algebra for recursive model calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "kleene"

[[bin]]
name = "kleene"
path = "src/main.rs"

[dependencies]
kleene-core = { workspace = true }
kleene-sql = { workspace = true }
kleene-algebra = { workspace = true }
kleene-exec = { workspace = true }
kleene-llm = { workspace = true }
kleene-tools = { workspace = true }
kleene-store = { workspace = true }
kleene-trace = { workspace = true }
kleene-harness = { workspace = true }
kleene-daemon = { workspace = true }
kleene-tui = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
console = "0.16"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
parquet = { version = "60", default-features = false }

[target.'cfg(windows)'.dependencies]
# The console code-page calls in src/console.rs (issue #72).
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
default = ["gateway"]
# The Open Responses gateway adapter and its page in the setup wizard.
gateway = ["kleene-llm/gateway", "kleene-tui/gateway"]

# The workspace lints, except that `unsafe_code` is denied rather than
# forbidden: src/codepage.rs allows it for the four kernel32 code-page calls
# on Windows (issue #72), and a forbid from Cargo.toml cannot be lifted by a
# module. Keep the rest in step with [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"
