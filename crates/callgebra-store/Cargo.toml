[package]
name = "callgebra-store"
description = "Embedded store for session tables, memo and trace (DuckDB)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
callgebra-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
callgebra-trace = { workspace = true }
duckdb = { version = "1.10505", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["duckdb"]
# DuckDB-backed store (the production store). Building it compiles DuckDB from
# source once, about ten minutes on four cores.
duckdb = ["dep:duckdb"]

[lints]
workspace = true
