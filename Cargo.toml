[workspace]
resolver = "2"
members = [
    "crates/kleene-core",
    "crates/kleene-sql",
    "crates/kleene-algebra",
    "crates/kleene-exec",
    "crates/kleene-llm",
    "crates/kleene-tools",
    "crates/kleene-store",
    "crates/kleene-trace",
    "crates/kleene-harness",
    "crates/kleene-daemon",
    "crates/kleene-tui",
    "crates/kleene",
    "crates/kleene-difftest",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MarcusElwin/kleene"
homepage = "https://kleene.sh"
authors = ["Marcus Elwin"]

[workspace.dependencies]
kleene-core = { path = "crates/kleene-core" }
kleene-sql = { path = "crates/kleene-sql" }
kleene-algebra = { path = "crates/kleene-algebra" }
kleene-exec = { path = "crates/kleene-exec" }
kleene-llm = { path = "crates/kleene-llm" }
kleene-tools = { path = "crates/kleene-tools" }
kleene-store = { path = "crates/kleene-store" }
kleene-trace = { path = "crates/kleene-trace" }
kleene-harness = { path = "crates/kleene-harness" }
kleene-daemon = { path = "crates/kleene-daemon" }
kleene-tui = { path = "crates/kleene-tui" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

# DuckDB's C++ objects carry `-g` whenever the profile has any debug info,
# which is most of what makes every test binary that links the store ~700 MB
# and every link slow. Nobody steps through DuckDB in gdb from here; keep
# line tables for our own crates and none for the amalgamation.
[profile.dev.package.libduckdb-sys]
debug = false
