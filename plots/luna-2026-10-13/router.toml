# GPT-6 Luna on the four hard packs (13 October 2026): every solver alias on
# gpt-6-luna over chat completions. Since October 2026 the API rejects
# function tools unless reasoning_effort is "none" on this endpoint, so the
# root alias (which the plain agent uses with native tools) runs at none in
# every mode; no hard pack uses the judge.
[aliases.root]
candidates = [{ provider = "openai_compat", model = "gpt-6-luna" }]
options = { effort = "none" }

[aliases.worker]
candidates = [{ provider = "openai_compat", model = "gpt-6-luna" }]

[aliases.proxy]
candidates = [{ provider = "openai_compat", model = "gpt-6-luna" }]

[aliases.judge]
candidates = [{ provider = "anthropic", model = "claude-sonnet-5-5" }]
options = { effort = "medium", cache_prefix = true }

[pricing."gpt-6-luna"]
input_per_mtok = 0.10
output_per_mtok = 0.50
cache_read_per_mtok = 0.01
cache_write_per_mtok = 0.125

[pricing."claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_read_per_mtok = 0.2
cache_write_per_mtok = 2.5
