# Haiku 4.5 on the four hard packs (13 October 2026): every solver alias on
# claude-haiku-4-5-20251001; the judge alias is Sonnet 5.5 but no hard pack uses a judge.
[aliases.root]
candidates = [{ provider = "anthropic", model = "claude-haiku-4-5-20251001" }]
options = { cache_prefix = true }

[aliases.worker]
candidates = [{ provider = "anthropic", model = "claude-haiku-4-5-20251001" }]
options = { cache_prefix = true }

[aliases.proxy]
candidates = [{ provider = "anthropic", model = "claude-haiku-4-5-20251001" }]
options = { cache_prefix = true }

[aliases.judge]
candidates = [{ provider = "anthropic", model = "claude-sonnet-5-5" }]
options = { effort = "medium", cache_prefix = true }

[pricing."claude-haiku-4-5-20251001"]
input_per_mtok = 1.0
output_per_mtok = 5.0
cache_read_per_mtok = 0.1
cache_write_per_mtok = 1.25

[pricing."claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_read_per_mtok = 0.2
cache_write_per_mtok = 2.5
