# Opus 5.5 sweep of the harder packs: the default routing shape of the
# 27 September run (root on Opus 5.5 at high effort, proxy on Haiku 4.5),
# with worker and judge moved to Sonnet 5.5.
[aliases.root]
candidates = [{ provider = "anthropic", model = "claude-opus-5-5" }]
options = { effort = "high", cache_prefix = true }

[aliases.worker]
candidates = [{ provider = "anthropic", model = "claude-sonnet-5-5" }]
options = { effort = "medium", cache_prefix = true }

[aliases.proxy]
candidates = [{ provider = "anthropic", model = "claude-haiku-4-5-20251001" }]
options = { cache_prefix = true }

[aliases.judge]
candidates = [{ provider = "anthropic", model = "claude-sonnet-5-5" }]
options = { effort = "medium", cache_prefix = true }

[pricing."claude-opus-5-5"]
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_read_per_mtok = 0.4
cache_write_per_mtok = 5.0

[pricing."claude-sonnet-5-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0
cache_read_per_mtok = 0.2
cache_write_per_mtok = 2.5

[pricing."claude-haiku-4-5-20251001"]
input_per_mtok = 1.0
output_per_mtok = 5.0
cache_read_per_mtok = 0.1
cache_write_per_mtok = 1.25
